[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "vha06", email = "hachu120406@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "chromadb>=1.5.9",
    "crewai>=0.193.2",
    "duckduckgo-search>=8.1.1",
    "fastapi>=0.141.1",
    "google-genai>=0.1.0",
    "html2text>=2025.4.15",
    "httpx>=0.28.0",
    "langchain-google-genai>=4.3.2",
    "llama-index>=0.14.23",
    "llama-index-embeddings-gemini>=0.4.2",
    "llama-index-llms-gemini>=0.6.2",
    "llama-index-vector-stores-chroma>=0.5.5",
    "networkx>=3.6.1",
    "playwright>=1.61.0",
    "playwright-stealth>=2.0.3",
    "pydantic>=2.13.4",
    "pytest>=8.0.0",
    "pytest-asyncio>=1.4.0",
    "redis>=8.0.1",
    "tenacity>=9.0.0",
    "supabase>=2.13.0",
    "upstash-redis>=1.7.0",
    "uvicorn>=0.52.0",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

